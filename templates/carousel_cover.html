<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#333;font-family:'Noto Sans CJK KR',sans-serif}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;color:#fff;
   background:radial-gradient(ellipse at 50% 32%,#2a2112 0%,#111 45%,#0b0b0b 75%)}
.brand{position:absolute;top:56px;left:72px;font-size:30px;font-weight:700;color:#F7931A}
.tagr{position:absolute;top:56px;right:72px;font-size:28px;color:#888}
.copy{position:absolute;left:72px;right:72px;bottom:150px}
.kick{font-size:34px;font-weight:700;color:#F7931A;margin-bottom:18px}
.h{font-size:92px;font-weight:900;line-height:1.22;letter-spacing:-3px}
.o{color:#F7931A}
.sub{font-size:36px;color:#bdbdbd;margin-top:22px}
.foot{position:absolute;bottom:56px;left:72px;right:72px;display:flex;justify-content:space-between;font-size:26px;color:#777}
.coin{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900}
.btc{background:radial-gradient(circle at 35% 30%,#ffd08a 0%,#F7931A 38%,#b86100 100%);
     box-shadow:inset 0 0 0 14px #d97a0c, inset 0 0 0 20px #ffb24d, 0 30px 60px rgba(0,0,0,.6), 0 0 120px rgba(247,147,26,.35);color:#fff;text-shadow:0 6px 0 #a35400}
.usd{background:radial-gradient(circle at 35% 30%,#d9f7e4 0%,#6ccf93 40%,#1f7a46 100%);
     box-shadow:inset 0 0 0 14px #2f9b5c, inset 0 0 0 20px #a7ecc3, 0 30px 60px rgba(0,0,0,.6), 0 0 100px rgba(108,207,147,.25);color:#fff;text-shadow:0 6px 0 #145c33}
</style></head><body>

<!-- 표지 A: 달러 vs 비트코인 시소 -->
<div class="s" id="cA">
  <div class="brand">그래서비트</div><div class="tagr">기초 개념</div>
  <svg style="position:absolute;left:0;top:0" width="1080" height="820" viewBox="0 0 1080 820">
    <defs><linearGradient id="bm" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4a4a4a"/><stop offset="1" stop-color="#262626"/></linearGradient></defs>
    <g transform="rotate(14 540 560)"><rect x="150" y="548" width="780" height="26" rx="13" fill="url(#bm)"/></g>
    <polygon points="540,566 470,700 610,700" fill="#3a3a3a"/>
    <rect x="420" y="700" width="240" height="18" rx="9" fill="#2a2a2a"/>
    <g stroke="#6ccf93" stroke-width="10" stroke-linecap="round" fill="none" opacity=".9"><path d="M470 260 l0 -90 M440 200 l30 -30 l30 30"/></g>
    <g stroke="#F7931A" stroke-width="10" stroke-linecap="round" fill="none" opacity=".9"><path d="M990 420 l0 90 M960 480 l30 30 l30 -30"/></g>
  </svg>
  <div class="coin usd" style="width:280px;height:280px;left:130px;top:180px;font-size:170px">$</div>
  <div class="coin btc" style="width:280px;height:280px;left:680px;top:368px;font-size:160px">₿</div>
  <div class="copy">
    <div class="kick">달러 강세 = 비트코인 하락?</div>
    <div class="h">달러가 웃으면<br><span class="o">비트코인은 운다?</span></div>
    <div class="sub">반만 맞는 이야기, 7장으로 정리</div>
  </div>
  <div class="foot"><span>@so.bitcoin.kr</span><span>넘겨서 보기 →</span></div>
</div>

<!-- 표지 B: 연설대 한마디 -->
<div class="s" id="cB">
  <div class="brand">그래서비트</div><div class="tagr">시장 해석</div>
  <svg style="position:absolute;left:0;top:0" width="1080" height="840" viewBox="0 0 1080 840">
    <defs>
      <linearGradient id="pd" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3b3b3b"/><stop offset="1" stop-color="#1b1b1b"/></linearGradient>
      <radialGradient id="sp" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    </defs>
    <polygon points="440,0 640,0 860,820 220,820" fill="url(#sp)"/>
    <!-- 뒤 배경 하락 차트 -->
    <polyline points="80,230 200,200 300,250 400,210 520,300 610,280 720,420 820,400 1000,560" fill="none" stroke="#F7931A" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>
    <polygon points="1000,560 960,520 1030,505" fill="#F7931A" opacity=".85"/>
    <!-- 연설대 -->
    <path d="M370 520 L710 520 L680 800 L400 800 Z" fill="url(#pd)" stroke="#4d4d4d" stroke-width="4"/>
    <rect x="350" y="495" width="380" height="36" rx="10" fill="#4a4a4a"/>
    <circle cx="540" cy="650" r="62" fill="none" stroke="#777" stroke-width="6"/>
    <text x="540" y="672" text-anchor="middle" font-size="62" font-weight="900" fill="#777" font-family="Noto Sans CJK KR">$</text>
    <!-- 마이크 -->
    <path d="M520 495 C 515 440, 540 420, 560 400" fill="none" stroke="#999" stroke-width="7" stroke-linecap="round"/>
    <rect x="550" y="360" width="34" height="58" rx="17" fill="#cfcfcf" transform="rotate(30 567 389)"/>
    <!-- 음파 -->
    <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".7">
      <path d="M620 330 q30 30 0 60"/><path d="M650 305 q50 55 0 110"/><path d="M680 280 q70 80 0 160"/>
    </g>
  </svg>
  <div class="copy">
    <div class="kick">FOMC 기자회견 보는 법</div>
    <div class="h">말 한마디에<br><span class="o">비트코인이 흔들린다</span></div>
    <div class="sub">연준 의장이 '이 단어'를 쓰면 주목하세요</div>
  </div>
  <div class="foot"><span>@so.bitcoin.kr</span><span>넘겨서 보기 →</span></div>
</div>
</body></html>
